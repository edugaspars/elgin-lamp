name: Build

# Gera os executáveis (Windows e Linux). Usado pelo CI e pela release.
on:
  workflow_call:
    inputs:
      version:
        description: "Versão gravada no executável (vazio = calculada pelo Git)"
        type: string
        default: ""
      ref:
        description: "Commit a compilar (vazio = o do evento)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LampDesk-windows
            file: dist/LampDesk.exe
          - os: ubuntu-22.04  # glibc mais antiga: o binário roda em mais distribuições
            artifact: LampDesk-linux
            file: dist/LampDesk-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # tags, para calcular a versão
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: PyInstaller
        run: python scripts/build.py ${{ inputs.version }}
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
