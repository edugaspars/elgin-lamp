name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Nenhum IP/chave no repositório
        run: python scripts/check_secrets.py --all
      - run: python -m pyflakes elgin_lamp scripts tests
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ElginLamp --icon build/icon.ico --paths .
          --collect-submodules tinytuya
          --exclude-module tkinter --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtQuick --exclude-module PySide6.Qt3DCore
          elgin_lamp/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: ElginLamp-windows
          path: dist/ElginLamp.exe
