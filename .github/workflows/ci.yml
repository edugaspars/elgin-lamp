name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, para calcular a versão
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Nenhum IP/chave no repositório
        run: python scripts/check_secrets.py --all
      - run: python -m pyflakes lampdesk scripts tests
      - run: python -m pytest -q

  build:
    needs: test
    uses: ./.github/workflows/build.yml
